name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.3.11579264
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: nbproxy/go.mod

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-24" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Build nbproxy AAR
        working-directory: nbproxy
        run: |
          # Pin gomobile/gobind to the x/mobile version this module already
          # depends on. Using @latest broke the build once x/mobile started
          # requiring Go 1.26 (newer than actions/setup-go pins here).
          GOMOBILE_VERSION=v0.0.0-20260820023541-8e8303b9da6c
          go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}
          export PATH="$HOME/go/bin:$PATH"
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64 -androidapi 24 -o ../app/libs/nbproxy.aar .

      - name: Build and sign release APK
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "Keystore decoded"
          fi
          ./gradlew assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true